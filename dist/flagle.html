<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flagle</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="flagle-style.css" />
<script defer src="flagle.bundle.js"></script></head>
<body>
<div id="app">

    <!-- ── LOADING ───────────────────────────────── -->
    <div id="flagle-loading-screen" class="screen active">
        <div class="loading-inner">
            <div class="brand-dots loading-dots">
                <span class="bdot" style="--c:#E63946; --i:0"></span>
                <span class="bdot" style="--c:#457B9D; --i:1"></span>
                <span class="bdot" style="--c:#F4A261; --i:2"></span>
                <span class="bdot" style="--c:#2A9D8F; --i:3"></span>
                <span class="bdot" style="--c:#E9C46A; --i:4"></span>
            </div>
            <p class="loading-label" id="flagle-loading-label">Connecting…</p>
        </div>
        <div id="flagle-debug-log"
             style="
             margin-top:20px;
             max-height:200px;
             overflow:auto;
             font-family:monospace;
             font-size:11px;
             text-align:left;
             width:90%;
             border:1px solid #333;
             padding:8px;
             display:none;">
        </div>
    </div>

    <!-- ── GAME ──────────────────────────────────── -->
    <div id="flagle-game-screen" class="screen">
        <span class="top-label">
            Flagle &nbsp;·&nbsp; Color <span id="flagle-round-label">1 / 1</span>
        </span>

        <!-- Flag preview — updates live as you drag sliders -->
        <div id="flagle-flag-display" class="flagle-flag-container"></div>

        <p class="flagle-group-hint">
            Pick the color for: <strong id="flagle-group-label">–</strong>
        </p>

        <!-- Same HSB picker layout as Chroma -->
        <div id="flagle-picker">
            <div id="flagle-sliders-area">
                <div class="scol">
                    <div class="color-track" id="flagle-track-hue">
                        <div class="color-handle" id="flagle-handle-hue"></div>
                    </div>
                </div>
                <div class="scol">
                    <div class="color-track" id="flagle-track-sat">
                        <div class="color-handle" id="flagle-handle-sat"></div>
                    </div>
                </div>
                <div class="scol">
                    <div class="color-track" id="flagle-track-bri">
                        <div class="color-handle" id="flagle-handle-bri"></div>
                    </div>
                </div>
            </div>

            <!-- Preview of the picked color + submit button -->
            <div id="flagle-color-preview">
                <span id="flagle-round-label-overlay" class="flagle-round-overlay"></span>
                <button id="flagle-submit-btn" class="submit-btn" title="Confirm this color">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ── RESULT ────────────────────────────────── -->
    <div id="flagle-result-screen" class="screen">
        <div class="flagle-result-inner">

            <p id="flagle-flag-name-reveal" class="flagle-flag-name">–</p>

            <!-- Side-by-side flag comparison -->
            <div class="flagle-flag-compare">
                <div class="flagle-cmp-col">
                    <span class="cmp-label">Your guess</span>
                    <div id="flagle-completed-flag" class="flagle-cmp-flag"></div>
                </div>
                <div class="flagle-cmp-col">
                    <span class="cmp-label">Original</span>
                    <div id="flagle-perfect-flag" class="flagle-cmp-flag"></div>
                </div>
            </div>

            <!-- Score -->
            <div class="pts-area" style="margin-top:12px">
                <span class="pts-label">Total score</span>
                <div id="flagle-total-score" class="flagle-total">0 / 0</div>
            </div>

            <!-- Per-color breakdown bars -->
            <div id="flagle-score-breakdown" class="flagle-breakdown"></div>

            <!-- Rank -->
            <p id="flagle-rank-display" class="flagle-rank-text"></p>

            <!-- Leaderboard section (inline on this screen) -->
            <h3 class="flagle-board-title">Leaderboard</h3>
            <p id="flagle-results-sub" class="results-sub">–</p>
            <div id="flagle-final-board" class="results-board-inner"></div>

        </div>
    </div>

</div>

</body>
</html>
