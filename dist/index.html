<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Hub</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* Force the menu to show immediately without JS */
        #menu-screen { opacity: 1; pointer-events: all; transform: translateY(0); }
        .hub-buttons { display: flex; flex-direction: column; gap: 16px; margin-top: 24px; width: 100%; }
        .hub-title { font-size: 42px; line-height: 1; letter-spacing: -0.02em; font-weight: 700; margin-top: 10px; }
    </style>
<script defer src="bundle.js"></script></head>
<body>
<div id="hub-wrapper">
    <div id="app">
        <div id="menu-screen" class="screen active">
            <div class="start-inner">
                <h1 class="hub-title">Daily Games</h1>
                <div class="hub-buttons">
                    <!-- Games will be auto-populated by hub.js -->
                </div>
            </div>
        </div>
    </div>
</div>

<div id="chroma-wrapper" style="display: none;">
</div>

<div id="flagle-wrapper" style="display: none;">
</div>
</body>
</html>
